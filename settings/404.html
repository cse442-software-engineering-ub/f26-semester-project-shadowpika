  <body style="margin: 0">
    <div id="root"></div>
    <script>
      document.addEventListener("DOMContentLoaded", () => {


            const addLogoutButton = () => {
                if (document.querySelector(".nav-logout") && !document.querySelector(".nav-logout").closest(".nav-drawer") && (getComputedStyle(document.querySelector(".nav-drawer")).display !== "none")) {
                    document.querySelector(".nav-logout").remove();
                }
                if (document.querySelector(".nav-logout") && !document.querySelector(".nav-logout").closest(".nav-drawer") && (getComputedStyle(document.querySelector(".nav-drawer")).display === "none")) {
                    return;
                }
                // -----------------------------
                // Desktop Logout button
                // -----------------------------
                const searchButton = document.querySelector(".nav-search");
                const menuLinks = document.querySelector(".nav-drawer-links");


                if (searchButton && (getComputedStyle(document.querySelector(".nav-drawer")).display === "none") && !document.querySelector(".nav-logout-desktop")) {


                    const logoutButton = document.createElement("button");


                    logoutButton.type = "button";
                    logoutButton.className = "nav-logout nav-logout-desktop";
                    logoutButton.textContent = "Log Out";


                    logoutButton.addEventListener("click", () => {
                        window.location.replace("index.html");
                    });


                    logoutButton.style.font = "inherit";
                    logoutButton.style.color = "inherit";
                    logoutButton.style.cursor = "pointer";
                    logoutButton.style.border = "none";


                    searchButton.insertAdjacentElement("afterend", logoutButton);
                }




                // -----------------------------
                // Mobile hamburger Logout button
                // -----------------------------


                if (menuLinks && !document.querySelector(".nav-logout-mobile")) {


                    const logoutButton = document.createElement("button");


                    logoutButton.type = "button";
                    logoutButton.className = "nav-drawer-link nav-logout nav-logout-mobile";
                    logoutButton.textContent = "Log Out";


                    logoutButton.addEventListener("click", () => {
                        window.location.replace("index.html");
                    });


                    const logoutItem = document.createElement("li");


                    logoutItem.appendChild(logoutButton);
                    menuLinks.appendChild(logoutItem);
                }
            };




            // -----------------------------
            // React may render the navbar
            // after DOMContentLoaded
            // -----------------------------
            const observer = new MutationObserver(() => {
                addLogoutButton();
            });


            observer.observe(document.body, {
                childList: true,
                subtree: true
            });


            logoutInterval = setInterval(() => {
                addLogoutButton();
            }, 1000);
            // Try immediately


        });
    </script>
  </body>
