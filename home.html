    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=League+Spartan:wght@400;600;700&display=swap" rel="stylesheet" />
    <title>Karavan - Home</title>
    <script type="module" crossorigin src="./assets/home-DlLakfip.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/jsx-runtime-aUCHvG4-.js">
    <link rel="modulepreload" crossorigin href="./assets/NavBar-CO2aEYeg.js">
    <link rel="modulepreload" crossorigin href="./assets/PlaceholderPage-DF6IhdKg.js">

  </head>
  <body>
    <div id="root"></div>
    <script>
      function getCookies(cookieName){
            const cookies = document.cookie.split("; ")

            for (const cookie of cookies) {
                const [name, value] = cookie.split('=');
                
                // 3. If the name matches, decode and return the value
                if (name === cookieName) {
                    return decodeURIComponent(value);
                }
            }
            return null; // Return null if the cookie doesn't exist
      }


      const intervalId = setInterval(() => {
        if (!getCookies("karavan_auth_cookie")){
            window.location.replace("404.html");
        }
      }, 100);
      
        document.addEventListener("DOMContentLoaded", () => {

            const addLogoutButton = () => {
                if (document.querySelector(".nav-logout") && !document.querySelector(".nav-logout").closest(".nav-drawer") && (getComputedStyle(document.querySelector(".nav-drawer")).display !== "none")) {
                    document.querySelector(".nav-logout").remove();
                }
                if (document.querySelector(".nav-logout") && !document.querySelector(".nav-logout").closest(".nav-drawer") && (getComputedStyle(document.querySelector(".nav-drawer")).display === "none")) {
                    return;
                }

        function logout(){
            fetch("logout.php", {
                method: "DELETE",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    current_username: getCookies("karavan_auth_cookie")
                })
            })
            .then(response => {
                console.log("HTTP status:", response.status);
                return response.json();
            })
            .then(data => {
                console.log("PHP response:", data);
                if (data.success) {
                    window.location.replace("index.html");
                } else {
                    alert(data.error);
                }
            })
            .catch(error => {
                console.error("Fetch error:", error);
            });
        }
        const intervalId = setInterval(() => {
            if (!getCookies("karavan_auth_cookie")){
                window.location.replace("404.html");
            }
      }, 1000);

        const logoutButton = document.createElement("button");

        logoutButton.type = "button";
        logoutButton.className = "nav-logout";
        logoutButton.textContent = "Log Out";

        logoutButton.addEventListener("click", async () => {
            logout();
        });

        profileButton.insertAdjacentElement("afterend", logoutButton);
    };

    // React may render the navbar after DOMContentLoaded,
    // so check repeatedly until the Profile button exists.
    const observer = new MutationObserver(() => {
        addLogoutButton();
    });

    observer.observe(document.body, {
        childList: true,
        subtree: true
    });

    addLogoutButton();
    });
    </script>
  </body>
</html>
