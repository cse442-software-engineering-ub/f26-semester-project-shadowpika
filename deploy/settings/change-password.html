<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Karavan - Change Password</title>

  <script type="module" crossorigin src="../assets/api-9zkWTuUC.js"></script>
  <script type="module" crossorigin src="../assets/NavBar-DwsCXHHB.js"></script>
  <script type="module" crossorigin src="../assets/session-guard-CTGY7Rti.js"></script>
  <script type="module" crossorigin src="../assets/navbar-main-DEsfX152.js"></script>
  <link rel="stylesheet" crossorigin href="../assets/NavBar-BJZVDRlr.css">
  <link rel="stylesheet" crossorigin href="../assets/changePassword-TL9GorGP.css">
</head>

<body>

    <!-- =========================
         NAVIGATION
    ========================= -->
    <div id="root"></div>

    <!-- =========================
         PASSWORD PAGE
    ========================= -->

    <main class="password-page">

        <div class="password-container">


            <!-- =====================
                 LOGO
            ====================== -->

            <section class="password-logo">

                <svg class="logo-image" viewBox="0 0 52 36" fill="none" aria-hidden="true">
                    <path d="M6 5h30c7.2 0 13 5.8 13 13v7a2 2 0 0 1-2 2H6a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3z" stroke="#1f2d44" stroke-width="2.4"></path>
                    <rect x="8" y="10" width="11" height="7" rx="1.5" stroke="#1f2d44" stroke-width="2"></rect>
                    <path d="M39 10h1.5a5 5 0 0 1 5 5v2H39z" stroke="#1f2d44" stroke-width="2" stroke-linejoin="round"></path>
                    <rect x="25" y="10" width="8" height="15" rx="1" fill="#d9a441" stroke="#1f2d44" stroke-width="1.6"></rect>
                    <circle cx="31" cy="18" r="0.9" fill="#1f2d44"></circle>
                    <circle cx="15" cy="28" r="5" fill="#3f6fa0" stroke="#1f2d44" stroke-width="2"></circle>
                    <circle cx="15" cy="28" r="1.6" fill="#f6f1ea"></circle>
                </svg>

                <div class="logo-text">
                    KARAVAN
                </div>

            </section>


            <!-- =====================
                 PASSWORD FORM
            ====================== -->

            <section class="password-form">

                <div class="form-group">

                    <label
                        class="form-label"
                        for="current-password"
                    >
                        Current Password
                    </label>

                    <input
                        id="current-password"
                        class="password-input"
                        type="password"
                        placeholder="Please enter your current password"
                    >

                </div>


                <div class="form-group">

                    <label
                        class="form-label"
                        for="new-password"
                    >
                        New Password
                    </label>

                    <input
                        id="new-password"
                        class="password-input"
                        type="password"
                        placeholder="Please enter your new password"
                    >

                </div>


                <button
                    class="change-button"
                    type="button" onClick="submitData()">
                    Change Password
                </button>

            </section>

        </div>
        <script>
        function submitData() {
            let curr = document.getElementById("current-password").value;
            let fut = document.getElementById("new-password").value;

            fetch("pass.php", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    current_password: curr,
                    new_password: fut
                })
            })
            .then(response => {
                console.log("HTTP status:", response.status);
                return response.json();
            })
            .then(data => {
                console.log("PHP response:", data);

                if (data.success) {
                    alert("Password has been changed")
                } else {
                    console.log("Error:", data.error);
                    alert(data.error);
                }
            })
            .catch(error => {
                console.error("Fetch error:", error);
            });
        }

        function getCookies(cookieName){
            const cookies = document.cookie.split("; ")

            for (const cookie of cookies) {
                const [name, value] = cookie.split('=');
                
                // 3. If the name matches, decode and return the value
                if (name === cookieName) {
                    return decodeURIComponent(value);
                }
            }
            return null; // Return null if the cookie doesn't exist
        }


        
    </script>

    </main>

</body>
</html>
