        <script>
            function getCookies(cookieName){
                const cookies = document.cookie.split("; ")

                for (const cookie of cookies) {
                    const [name, value] = cookie.split('=');
                    
                    // 3. If the name matches, decode and return the value
                    if (name === cookieName) {
                        return decodeURIComponent(value);
                    }
                }
                return null; // Return null if the cookie doesn't exist
            }

            

            function toggle(){
                let gotten = document.getElementById("toggle1");
                if (gotten.classList.contains('active')){
                    gotten.classList.remove('active');
                }else{gotten.classList.add('active');}
            }
            function otherToggle(){
