<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karavan - Settings</title>
    <link rel="stylesheet" href="account-settings.css" type="text/css">
    <script type="module" crossorigin src="../assets/Nav-Settings.js"></script>
    <link rel="modulepreload" crossorigin href="../assets/NavBar-CO2aEYeg.js">
    <link rel="stylesheet" crossorigin href="../assets/NavBar-pP62phn7.css">
</head>

<body>
    <div id="root"></div>

    <!-- Main Content -->
    <main class="main">

        <h1 class="page-title">Settings</h1>

        <p class="page-description">
            Manage your preferences, account details, and app behavior.
        </p>


        <!-- Settings Card -->
        <section class="settings-card">

            <!-- Tabs -->
            <div class="tabs">
                <div class="tab">General</div>
                <div class="tab active">Account</div>
                <div class="tab">Customization</div>
                <a href="#" class="tab_group"><div class="tab">Admin</div></a>
            </div>


            <div class="settings-content">

                <!-- Profile -->
                <section class="profile-section">
                    <h2 class="section-title">Profile</h2>

                    <form name="user_info">
                    <div class="field">
                        <label class="field-label">Username</label>
                        <input
                            class="field-input"
                            type="text"
                            placeholder="John Doe"
                            id="name"
                            name="input_username"
                        >
                    </div>

                    <div class="field">
                        <label class="field-label">Email address</label>
                        <input
                            class="field-input"
                            type="email"
                            placeholder="john.doe@example.com"
                            id="email"
                            name="input_email"
                        >
                    </div>

                    <div class="field photo-field">
                        <label class="field-label photo-label">
                            Profile photo
                        </label>

                        <!-- <div class="upload-box" id="pfp">
                            <div class="camera-icon"></div>
                            <span class="upload-text">
                                Upload new photo
                            </span>
                        </div> -->
                    </div>
                    </form>
                </section>


                <!-- Password -->
                <section class="password-section">

                    <h2 class="section-title">Password</h2>

                    <div class="password-row">
                        <label class="password-label">Password</label>

                        <a href="change-password.html"><button class="change-password">
                            Change password
                        </button></a>

                        <span class="password-description">
                            Update your password to keep your account secure.
                        </span>
                    </div>

                </section>


                <!-- Danger Zone -->
                <section class="danger-section">

                    <h2 class="section-title">Danger Zone</h2>

                    <div class="delete-row">
                        <label class="delete-label">
                            Delete account
                        </label>

                        <button class="delete-button" type="submit" onClick="deleteAccount()">Delete account</button>

                        <span class="delete-description">
                            Permanently delete your account and all associated data.
                        </span>
                    </div>

                </section>


                <!-- Save -->
                <div class="save-area">
                    <button class="save-button" onClick="submitData()">
                        Save changes
                    </button>

                    <span class="save-description">
                        Changes will apply across all devices.
                    </span>
                </div>

            </div>

        </section>
        <script>
            document.getElementById("email").value = decodeURIComponent(getCookies("karavan_auth_cookie"));
            
        function getCookies(cookieName){
            const cookies = document.cookie.split("; ")

            for (const cookie of cookies) {
                const [name, value] = cookie.split('=');
                
                // 3. If the name matches, decode and return the value
                if (name === cookieName) {
                    return decodeURIComponent(value);
                }
            }
            return null; // Return null if the cookie doesn't exist
        }

        function deleteAccount(){
            var pass = prompt("Please enter your password to delete your account");

            if (pass == null) { 
                alert("Account deletion cancelled."); 
                return; 
            }

            var confirmation = prompt("Are you sure you want to delete your account? You can't go back after this!");

            if (confirmation == null) { 
                alert("Account deletion cancelled."); 
                return; 
            }

            fetch("delete.php", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    current_username: getCookies("karavan_auth_cookie"),
                    password: pass
                })
            })
            .then(response => {
                console.log("HTTP status:", response.status);
                return response.json();
            })
            .then(data => {
                console.log("PHP response:", data);
                
                if (data.success) {
                    window.location.replace("../index.html");
                } else {
                    alert(data.error);
        }
            })
            .catch(error => {
                console.error("Fetch error:", error);
            });
        }

        function submitData() {
            var pass = prompt("Please enter your password to make these changes:");

            let name = document.user_info.input_username.value;
            let address = document.user_info.input_email.value;

            fetch("account.php", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    current_username: getCookies("karavan_auth_cookie"),
                    username: name,
                    email: address,
                    password: pass
                })
            })
            .then(response => {
                console.log("HTTP status:", response.status);
                return response.json();
            })
            .then(data => {
                console.log("PHP response:", data);

                if (data.success) {
                    document.getElementById("name").value = data.username;
                    document.getElementById("email").value = data.email;
                } else {
                    document.getElementById("name").value = decodeURIComponent(getCookies("karavan_auth_cookie"));
                    document.getElementById("email").value = "";
                    console.log("Error:", data.error);
                    alert(data.error);
                }
            })
            .catch(error => {
                console.error("Fetch error:", error);
            });
        }

        const intervalId = setInterval(() => {
            window.location.replace("account-settings.html");
        }, 1);

        document.addEventListener("DOMContentLoaded", () => {

            const addLogoutButton = () => {
                if (document.querySelector(".nav-logout") && !document.querySelector(".nav-logout").closest(".nav-drawer") && (getComputedStyle(document.querySelector(".nav-drawer")).display !== "none")) {
                    document.querySelector(".nav-logout").remove();
                }
                if (document.querySelector(".nav-logout") && !document.querySelector(".nav-logout").closest(".nav-drawer") && (getComputedStyle(document.querySelector(".nav-drawer")).display === "none")) {
                    return;
                }

                // -----------------------------
                // Logout functionality
                // -----------------------------
                function logout() {
                    fetch("../logout.php", {
                        method: "DELETE",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            current_username: getCookies("karavan_auth_cookie")
                        })
                    })
                    .then(response => {
                        console.log("HTTP status:", response.status);
                        return response.json();
                    })
                    .then(data => {
                        console.log("PHP response:", data);

                        if (data.success) {
                            window.location.replace("index.html");
                        } else {
                            alert(data.error);
                        }
                    })
                    .catch(error => {
                        console.error("Fetch error:", error);
                    });
                }


                // -----------------------------
                // Desktop Logout button
                // -----------------------------
                const searchButton = document.querySelector(".nav-search");
                const menuLinks = document.querySelector(".nav-drawer-links");

                if (searchButton && (getComputedStyle(document.querySelector(".nav-drawer")).display === "none") && !document.querySelector(".nav-logout-desktop")) {

                    const logoutButton = document.createElement("button");

                    logoutButton.type = "button";
                    logoutButton.className = "nav-logout nav-logout-desktop";
                    logoutButton.textContent = "Log Out";

                    logoutButton.addEventListener("click", () => {
                        logout();
                    });

                    logoutButton.style.font = "inherit";
                    logoutButton.style.color = "inherit";
                    logoutButton.style.cursor = "pointer";
                    logoutButton.style.border = "none";

                    searchButton.insertAdjacentElement("afterend", logoutButton);
                }


                // -----------------------------
                // Mobile hamburger Logout button
                // -----------------------------

                if (menuLinks && !document.querySelector(".nav-logout-mobile")) {

                    const logoutButton = document.createElement("button");

                    logoutButton.type = "button";
                    logoutButton.className = "nav-drawer-link nav-logout nav-logout-mobile";
                    logoutButton.textContent = "Log Out";

                    logoutButton.addEventListener("click", () => {
                        logout();
                    });

                    const logoutItem = document.createElement("li");

                    logoutItem.appendChild(logoutButton);
                    menuLinks.appendChild(logoutItem);
                }
            };


            // -----------------------------
            // React may render the navbar
            // after DOMContentLoaded
            // -----------------------------
            const observer = new MutationObserver(() => {
                addLogoutButton();
            });

            observer.observe(document.body, {
                childList: true,
                subtree: true
            });

            logoutInterval = setInterval(() => {
                addLogoutButton();
            }, 1000);
            // Try immediately

        });

        </script>

    </main>

</body>
</html>
